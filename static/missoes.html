<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guilda de Mineradores — Quadro de Missões</title>
  <meta name="description" content="Quadro oficial de missões da Guilda de Mineradores. Veja os contratos disponíveis, recompensas e níveis de perigo." />

  <!-- Favicon: brasão da guilda -->
  <link rel="icon" type="image/svg+xml" href="/missoes-favicon.svg" />
  <link rel="apple-touch-icon" href="/icone-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#241608" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Fontes medievais -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pirata+One&display=swap"
    rel="stylesheet"
  />

  <!-- CSS original do guilda.raynathus.com.br, intacto (só o editor do mestre foi acrescentado no fim) -->
  <link rel="stylesheet" href="/missoes.css" />
</head>
<body>
  <!-- Atmosfera: vinheta e textura sobre a madeira -->
  <div class="vinheta" aria-hidden="true"></div>

  <header class="cabecalho">
    <div class="brasao" aria-hidden="true">
      <svg viewBox="0 0 100 110" width="92" height="100">
        <!-- Escudo -->
        <path d="M50 4 L92 18 V58 C92 84 72 100 50 106 C28 100 8 84 8 58 V18 Z"
              fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M50 16 L82 27 V57 C82 77 67 90 50 95 C33 90 18 77 18 57 V27 Z"
              fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.55"/>
        <!-- Picaretas cruzadas (cada uma = cabo + cabeça curva pontuda) -->
        <g transform="rotate(45 50 58)">
          <rect x="48.6" y="33" width="2.8" height="52" rx="1.4" fill="currentColor"/>
          <path d="M30 43 Q50 25 70 43 Q50 33 30 43 Z" fill="currentColor"/>
        </g>
        <g transform="rotate(-45 50 58)">
          <rect x="48.6" y="33" width="2.8" height="52" rx="1.4" fill="currentColor"/>
          <path d="M30 43 Q50 25 70 43 Q50 33 30 43 Z" fill="currentColor"/>
        </g>
        <!-- Rebite onde os cabos se cruzam -->
        <circle cx="50" cy="58" r="3.4" fill="#1a1008" opacity="0.45"/>
        <circle cx="50" cy="58" r="2.1" fill="currentColor"/>
        <!-- Gema / minério abaixo do cruzamento -->
        <path d="M50 75 L54.5 81 L50 90 L45.5 81 Z" fill="currentColor"/>
        <path d="M45.5 81 H54.5 M50 75 V90" stroke="#1a1008" stroke-width="0.8" opacity="0.5"/>
      </svg>
    </div>
    <p class="sobre-titulo">⛏ Por ordem da ⛏</p>
    <h1 class="titulo-principal">Guilda de Mineradores</h1>
    <p class="subtitulo">Quadro Oficial de Missões</p>
    <div class="filete" aria-hidden="true">
      <span></span>✠<span></span>
    </div>
    <p class="contador" id="contador">Carregando o pergaminho…</p>

    <!-- Quem está logado (vem da sessão do hub) -->
    <div class="usuario-atual" id="usuarioAtual" hidden>
      <span class="usuario-rotulo">Aventureiro(a):</span>
      <strong class="usuario-nome" id="usuarioNome"></strong>
      <button type="button" class="trocar-usuario" id="novoCartaz" hidden title="pregar um cartaz novo">✚ novo cartaz</button>
    </div>
  </header>

  <main class="quadro" id="quadro">
    <!-- Os cartazes de missão são injetados por missoes.js -->
  </main>

  <!-- Popup do Mestre: criar/editar um cartaz (o mesmo pergaminho da tela de login) -->
  <dialog class="editor-dialogo" id="editorDialogo">
    <form class="editor-cartaz" id="editorForm" method="dialog">
      <div class="furo furo-esq"></div>
      <div class="furo furo-dir"></div>
      <p class="login-sobre">⛏ Livro de contratos ⛏</p>
      <h2 class="login-titulo" id="editorTitulo">Novo cartaz</h2>
      <div class="editor-bloco">
        <label><span>Título</span><input class="ed-titulo" required maxlength="120"></label>
        <label><span>Solicitante</span><input class="ed-solicitante" maxlength="120"></label>
        <label><span>Local</span><input class="ed-local" maxlength="120"></label>
        <label><span>Descrição</span><textarea class="ed-descricao" maxlength="2000"></textarea></label>
        <label><span>Recompensa</span><input class="ed-recompensa" maxlength="120"></label>
        <label><span>Perigo</span><select class="ed-perigo"><option value="1">1 — Trivial</option><option value="2">2 — Moderado</option><option value="3">3 — Perigoso</option><option value="4">4 — Mortal</option><option value="5">5 — Lendário</option></select></label>
      </div>
      <div class="editor-acoes">
        <button type="submit" class="btn-concluir"><span class="btn-concluir-txt">Pregar no quadro</span></button>
        <button type="button" class="trocar-usuario" id="editorCancelar">cancelar</button>
        <span class="editor-msg" id="editorMsg"></span>
      </div>
    </form>
  </dialog>

  <footer class="rodape">
    <div class="filete" aria-hidden="true">
      <span></span>✠<span></span>
    </div>
    <p class="aviso">
      A Guilda não se responsabiliza por membros perdidos, soterrados ou
      transformados. Aventureiros devem estar registrados na Sede.
    </p>
  </footer>

  <script type="module" src="/hub.js"></script>
  <script type="module" src="/missoes.js"></script>
</body>
</html>
